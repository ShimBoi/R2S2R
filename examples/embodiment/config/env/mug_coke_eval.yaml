env_type: robolab
total_num_envs: null
auto_reset: True
ignore_terminations: False
use_rel_reward: False
seed: 0
group_size: 1

reward_coef: 1.0
use_fixed_reset_state_ids: False
eval_only: False  # SharedRandomization doesn't branch on this; kept for interface consistency.
max_steps_per_rollout_epoch: 450
max_episode_steps: 450 # full composed episode: 225 steps/subtask (multiple of num_action_chunks=15), not just the single-subtask 300 budget

video_cfg:
  save_video: True
  info_on_video: True
  fps: 20
  video_base_dir: ${runner.logger.log_path}/video/eval

init_params:
  id: "LongHorizonLatteartcupCokeTask"
  task_file: "long_horizon_latteartcup_coke_task.py"
  task_description: "Pick up the latte art cup and place it on the cutting board"
  mode: "full"
  subtasks:
    object_1: "ceramic_mug"
    object_2: "coke"
    surface: "cutting_board_a"
    instruction_1: "Pick up the latte art cup and place it on the cutting board"
    instruction_2: "Pick up the coke can and place it on the cutting board"
  save_end_state_path: null
  reset_states_path: null
  num_envs: null  # filled in at runtime from total_num_envs / num_processes

  over_shoulder_cam:
    height: 224
    width: 224
  wrist_cam:
    height: 224
    width: 224
