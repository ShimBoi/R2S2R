env_type: robolab
total_num_envs: null
auto_reset: True
ignore_terminations: False
use_rel_reward: False
seed: 0
group_size: 1

reward_coef: 1.0
use_fixed_reset_state_ids: False
eval_only: False  # SharedRandomization/CapturedStateRandomization don't branch on this; kept for interface consistency with other robolab env configs.
max_steps_per_rollout_epoch: 225
max_episode_steps: 225 # max episode steps for truncation

video_cfg:
  save_video: False
  info_on_video: True
  fps: 20
  video_base_dir: ${runner.logger.log_path}/video/train

# Real (production-scale) config for generic_single_edge_task.py -- the tree-discovery
# extension's generic replacement for a hand-written per-edge task file (PLAN.md section
# 8.0). Proven end-to-end (config schema, generic task file, batch-shape math) by
# tree_ext_smoketest_train.yaml/tree_ext_smoketest_A first; this is the same shape with
# smoke-test speed shortcuts undone (see the parent
# generic_single_edge_grpo_openpi_pi05.yaml for exactly which fields were restored).
#
# The edge_spec/reset_states_path values below are PLACEHOLDERS -- every real edge
# discovered by discover_and_train() overrides both via CLI
# (`+env.train.init_params.edge_spec_path=<path>`,
# `env.train.init_params.reset_states_path=<path or null>`, and the same mirrored onto
# env.eval -- see orchestrator.py's generate_training_config). The placeholder here is
# harmless (never actually used unoverridden in a real discover_and_train() run) but kept
# non-trivial (a real object_on_top example, not garbage) so this config is still directly
# runnable standalone for a quick sanity check without any CLI overrides at all.
init_params:
  id: "GenericSingleEdgeTask"
  task_file: "generic_single_edge_task.py"
  task_description: "Pick up the latte art cup and place it on the cutting board"
  mode: "single_edge"
  edge_spec:
    predicate: "object_on_top"
    predicate_args:
      object: "ceramic_mug"
      reference_object: "cutting_board_a"
      require_gripper_detached: true
    instruction: "Pick up the latte art cup and place it on the cutting board"
  save_end_state_path: null   # optionally set via CLI override to collect end-states inline during training
  reset_states_path: null     # null -> root edge (SharedRandomization); non-null -> CapturedStateRandomization
  num_envs: null  # filled in at runtime from total_num_envs / num_processes

  over_shoulder_cam:
    height: 224
    width: 224
  wrist_cam:
    height: 224
    width: 224
