env_type: robolab
total_num_envs: null
auto_reset: True
ignore_terminations: False
use_rel_reward: False
seed: 0
group_size: 1

reward_coef: 1.0
use_fixed_reset_state_ids: False
eval_only: False  # unused by SharedRandomization/CapturedStateRandomization; kept for interface consistency
max_steps_per_rollout_epoch: 225
max_episode_steps: 225 # max episode steps for truncation

video_cfg:
  save_video: False
  info_on_video: True
  fps: 20
  video_base_dir: ${runner.logger.log_path}/video/train

# Env config for generic_single_edge_task.py. The edge_spec/reset_states_path values below
# are PLACEHOLDERS -- every real edge overrides both via CLI
# (`+env.train.init_params.edge_spec_path=<path>`,
# `env.train.init_params.reset_states_path=<path or null>`, mirrored onto env.eval -- see
# orchestrator.py's generate_training_config). Kept as a real object_on_top example so this
# config is directly runnable standalone without CLI overrides.
init_params:
  id: "GenericSingleEdgeTask"
  task_file: "generic_single_edge_task.py"
  task_description: "Pick up the latte art cup and place it on the cutting board"
  mode: "single_edge"
  edge_spec:
    predicate: "object_on_top"
    predicate_args:
      object: "ceramic_mug"
      reference_object: "cutting_board_a"
      require_gripper_detached: true
    instruction: "Pick up the latte art cup and place it on the cutting board"
  save_end_state_path: null   # optionally set via CLI override to collect end-states inline during training
  reset_states_path: null     # null -> root edge (SharedRandomization); non-null -> CapturedStateRandomization
  num_envs: null  # filled in at runtime from total_num_envs / num_processes

  over_shoulder_cam:
    height: 224
    width: 224
  wrist_cam:
    height: 224
    width: 224
