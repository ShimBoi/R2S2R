# Pass 1: run your trained policy in RoboLab and save the exact action stream via
# the repo's existing CollectEpisode wrapper (rlinf/envs/wrappers/collect_episode.py).
# This is `robolab_mug_grpo_openpi_pi05.yaml` (already in the repo) with:
#   - only_eval / eval_rollout_epoch=1 (one rollout, not training)
#   - env.eval.data_collection enabled, writing one pickle per episode
# Nothing about how envs/rollout workers get built is changed -- same
# EnvWorker + MultiStepRolloutWorker + Ray Cluster path as every other config here.

defaults:
  - env/robolab_mug_on_cutting_board@env.train
  - env/robolab_mug_on_cutting_board@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "sim2sim_robolab_collect"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1        # one rollout for the verification episode

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 3
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 1
    max_episode_steps: 150
    max_steps_per_rollout_epoch: 150
    seed: 42
  eval:
    total_num_envs: 8
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    auto_reset: False
    ignore_terminations: False
    seed: 42
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    # Writes one pickle per completed episode with the full per-step
    # observation/action/reward/info stream -- exactly the CollectEpisode wrapper
    # env_worker.py already applies when this block is present. See
    # rlinf/envs/wrappers/collect_episode.py for the pickle schema.
    data_collection:
      enabled: True
      save_dir: ${runner.logger.log_path}/collected_actions
      export_format: pickle
      only_success: False

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "./model/pi05_droid_jointpos"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 64
  seed: 42
  enable_offload: True

  model:
    model_path: "./model/pi05_droid_jointpos"
    model_type: "openpi"
    action_dim: 7
    num_action_chunks: 15
    num_steps: 5
    openpi:
      config_name: "pi05_droid_jointpos"
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${actor.model.num_steps}

    is_lora: True
    lora_rank: 8
    lora_path: null   # set via CLI override: actor.model.lora_path=/path/to/lora_checkpoint

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
